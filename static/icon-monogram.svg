<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Black background for high contrast icon -->
  <rect width="512" height="512" rx="64" ry="64" fill="#000000"/>

  <!-- Monogram "R" using Reddit Sans (or strong fallback) -->
  <text
    x="256"
    y="275"
    font-family="'Reddit Sans', 'Segoe UI', 'Helvetica Neue', Arial, 'Apple Color Emoji', sans-serif"
    font-size="320"
    font-weight="900"
    letter-spacing="-12"
    fill="#FF4500"
    text-anchor="middle"
    dominant-baseline="middle"
  >R</text>

  <!-- Signature red dotted underline (scaled for icon) -->
  <line
    x1="138"
    y1="355"
    x2="374"
    y2="355"
    stroke="#FF4500"
    stroke-width="18"
    stroke-dasharray="5 12"
    stroke-linecap="round"
    opacity="0.95"
  />
</svg>
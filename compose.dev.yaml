# docker-compose -f compose.dev.yaml up -d
version: "3.8"

services:
  rettid:
    build: .
    restart: always
    container_name: "rettid"
    ports:
      - 8080:8080 # Specify `127.0.0.1:8080:8080` instead if using a reverse proxy
    user: nobody
    read_only: true
    security_opt:
      - no-new-privileges:true
      # - seccomp=seccomp-rettid.json
    cap_drop:
      - ALL
    networks:
      - rettid
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--tries=1", "http://localhost:8080/settings"]
      interval: 5m
      timeout: 3s

networks:
  rettid:

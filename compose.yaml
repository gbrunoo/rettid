services:
  rettid:
    image: gab360/rettid:latest
    # Falls back to building locally if the image isn't present.
    # Dockerfile.ubuntu is architecture-neutral and builds natively on both
    # amd64 and arm64; Dockerfile.alpine is smaller but x86_64-only.
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    restart: always
    container_name: "rettid"
    ports:
      - 8080:8080 # Specify `127.0.0.1:8080:8080` instead if using a reverse proxy
    user: nobody
    read_only: true
    security_opt:
      - no-new-privileges:true
      # - seccomp=seccomp-rettid.json
    cap_drop:
      - ALL
    env_file: .env
    networks:
      - rettid
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--tries=1", "http://localhost:8080/settings"]
      interval: 5m
      timeout: 3s

networks:
  rettid:
